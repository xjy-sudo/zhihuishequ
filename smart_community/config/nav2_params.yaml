amcl:
  ros__parameters:
    use_sim_time: True

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: /scan

    transform_tolerance: 1.0

    min_particles: 500
    max_particles: 2000


map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""


planner_server:
  ros__parameters:
    use_sim_time: True

    expected_planner_frequency: 20.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

      tolerance: 0.5
      use_astar: false


controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.005
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.19
      max_vel_y: 0.0
      max_vel_theta: 0.30

      min_speed_xy: 0.0
      max_speed_xy: 0.19
      min_speed_theta: 0.033

      acc_lim_x: 0.7
      acc_lim_y: 0.0
      acc_lim_theta: 0.40

      decel_lim_x: -0.7
      decel_lim_y: 0.0
      decel_lim_theta: -0.40

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 30

      sim_time: 1.2
      linear_granularity: 0.03
      angular_granularity: 0.02

      transform_tolerance: 0.2
      xy_goal_tolerance: 0.06
      trans_stopped_velocity: 0.02

      short_circuit_trajectory_evaluation: True
      stateful: True

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.20
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 40.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 12.0
      RotateToGoal.lookahead_time: -1.0


behavior_server:
  ros__parameters:
    use_sim_time: True
    cycle_frequency: 10.0

    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"


bt_navigator:
  ros__parameters:

    use_sim_time: True

    global_frame: map

    robot_base_frame: base_footprint

    odom_topic: /odom

    default_server_timeout: 20


waypoint_follower:
  ros__parameters:

    use_sim_time: True

    loop_rate: 20


velocity_smoother:
  ros__parameters:

    use_sim_time: True

    smoothing_frequency: 20.0

    scale_velocities: False

    feedback: OPEN_LOOP

    max_velocity:
      x: 0.22
      y: 0.0
      z: 2.5

    min_velocity:
      x: -0.22
      y: 0.0
      z: -2.5


collision_monitor:
  ros__parameters:

    use_sim_time: True
